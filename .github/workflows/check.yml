name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 lint/chiaro_lint.py --self-test
      - run: node --test src/hooks/italiano-chiaro-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      - run: python3 lint/check_numbers.py
      # Il README deve rispettare le sue regole.
      - run: python3 lint/chiaro_lint.py --gate --type descriptive README.md
